name: Check repository files

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

permissions:
  contents: read

jobs:
  repository-files:
    runs-on: ubuntu-latest
    steps:
      - name: Check out git repository
        uses: actions/checkout@v6

      - name: Reject committed files covered by gitignore
        shell: bash
        run: |
          ignored_files=$(git ls-files --cached --ignored --exclude-standard)
          if [[ -n "$ignored_files" ]]; then
            printf 'Remove these local files from Git tracking:\n'
            printf '%s\n' "$ignored_files"
            exit 1
          fi
